<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="36" y1="8" x2="56" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- Transparency Checkerboard Pattern (Bottom-Right Cutout Zone) -->
  <g opacity="0.28" fill="#94A3B8">
    <rect x="32" y="32" width="6" height="6" rx="1" />
    <rect x="44" y="32" width="6" height="6" rx="1" />
    <rect x="38" y="38" width="6" height="6" rx="1" />
    <rect x="50" y="38" width="6" height="6" rx="1" />
    <rect x="32" y="44" width="6" height="6" rx="1" />
    <rect x="44" y="44" width="6" height="6" rx="1" />
    <rect x="38" y="50" width="6" height="6" rx="1" />
    <rect x="50" y="50" width="6" height="6" rx="1" />
  </g>

  <!-- Back Image Frame -->
  <rect x="11" y="15" width="32" height="32" rx="7" fill="#1E293B" stroke="#475569" stroke-width="2" />

  <!-- Foreground Extracted Subject + Vector Bezier Curve -->
  <path d="M16 41L24.5 29.5L31 37L36.5 30.5L45 41H16Z" fill="url(#accentGrad)" />
  <circle cx="22.5" cy="23.5" r="3.5" fill="#38BDF8" />

  <!-- Diagonal Cutout Split Line + Bezier Anchor Nodes -->
  <path d="M14 50L50 14" stroke="url(#accentGrad)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="4 4" />
  <rect x="29" y="29" width="6" height="6" rx="1.5" fill="#0F172A" stroke="#38BDF8" stroke-width="2.2" />

  <!-- AI Sparkle Star (Top Right) -->
  <path d="M47 10L49.2 16.8L56 19L49.2 21.2L47 28L44.8 21.2L38 19L44.8 16.8L47 10Z" fill="url(#sparkleGrad)" />
</svg>

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-processor-server
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
    environment:
      - U2NET_HOME=/app/models
      - HOST=0.0.0.0
      - PORT=8000
      - RUST_LOG=info
    restart: always
